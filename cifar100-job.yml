apiVersion: batch/v1
kind: Job
metadata:
  name: xgcd-cifar100-8020
  namespace: longweiwangusd
spec:
  template:
    spec:
      containers:
      - name: xgcd-container
        image: continuumio/anaconda3:latest
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            set -e

            # GPU Verification
            echo "=========================================="
            echo "Verifying GPU availability..."
            echo "=========================================="
            sleep 5
            nvidia-smi || (echo "ERROR: GPU not accessible!" && exit 1)

            export CUDA_DEVICE_ORDER=PCI_BUS_ID

            cd /data/xGCD

            # Initialize conda
            source /opt/conda/etc/profile.d/conda.sh

            # Setup environment (creates env 'xGCD', caches DINO weights)
            echo "=========================================="
            echo "Running setup.sh..."
            echo "=========================================="
            bash setup.sh
            conda activate xGCD

            # Verify installation
            python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available!'; print(f'PyTorch {torch.__version__} / CUDA {torch.version.cuda}')"
            python -c "import wandb; print(f'wandb {wandb.__version__}')"
            python -c "import torch; print(f'GPU: {torch.cuda.get_device_name(0)}')"

            mkdir -p exp data/datasets logs/wandb

            # ============================================================
            # CIFAR-100 (80 known / 20 novel) — CALIBRATION RUN.
            # Cleanup is OFF (dpmm_absorb / dpmm_merge / peak_gate = False) so the run is
            # log-only: it prints C, cond(Sigma), the [absorb] distance table, the per-cluster
            # composition, and the [phase3 peak-gate] peak values WITHOUT acting on them.
            # Read those to set absorb_scale / peak_thresh / novelty_alpha for a second run;
            # the CIFAR-10 values (0.1 / 0.80 / 0.2) are NOT expected to transfer.
            # ============================================================
            DATASET="cifar100"
            NUM_LABELED="80"                     # 80/20 split (use 50 for the 50/50 split)
            EXP_NAME="stage1_cbl_cifar100_8020"  # fresh CBL for this split
            SEED="42"                            # Stage-1 seed (reproducible)
            CONF_THR="0.15"

            WANDB_PROJECT="xGCD"
            WANDB_ENTITY="ifrat-ikhtear-university-of-south-dakota"
            export WANDB_DIR="logs"

            SMOKE="${SMOKE:-0}"
            if [ "$SMOKE" = "1" ]; then
                STAGE1_EPOCHS=2; REFRESH=2; P3_EPOCHS=4
            else
                # 80 known classes + a larger concept vocabulary -> Stage 1 may want more
                # epochs than CIFAR-10; bump STAGE1_EPOCHS if the CBL is under-trained.
                # P3_EPOCHS=0 -> ESTIMATION-ONLY (no CE representation learning): runs the
                # E-step + discovery diagnostics (~5 min) and stops. Set back to 15 for the
                # FINAL run once beta / min_cluster / absorb / gate are calibrated.
                STAGE1_EPOCHS=50; REFRESH=2; P3_EPOCHS=0
            fi

            # ---- estimation geometry (same recipe as CIFAR-10; recalibrate after run 1) ----
            CBL_LR="1e-3"
            ALPHA_FIDELITY="0.5"
            NOVELTY_ALPHA="0.2"     # may need raising: 80 known classes strengthen absorption bias
            TAU_MODE="empirical"
            GRAD_CLIP="1.0"
            LDA_RIDGE="0.1"         # keep at 0.1: cond(Sigma)=600 was NOT the cause of K=1.
                                    # (gamma is a gate-power experiment, judged on recall/purity, run alone.)
            DPMM_COV_SCALE="1.0"
            DPMM_ALPHA="1.0"
            # new-table barrier = C*ln(1+beta). beta=0.07 (~49 nats, CIFAR-10-matched) broke the
            # K=1 collapse but UNDER-split (K=6; 3 mega-blobs merging ~15 classes). CIFAR-100's
            # 20 novel classes sit closer than CIFAR-10's 5, so the bar must be lower: try 0.03
            # (~21 nats). If still under-split, 0.01 (~7 nats); watch for over-split into junk.
            DPMM_BETA="0.01"
            DPMM_SEED="42"
            # min-cluster prune floor = max(SIZE, FRAC*pool). CIFAR-10 used 1% (=~205 on its 20k
            # pool). Here novel classes are SMALL (pool has 37-458 per class): a 1% floor (~100)
            # would erase c96(37)/c95(124) before the DPMM can count them. Use max(30, 0.3%).
            DPMM_MIN_CLUSTER_SIZE="30"
            DPMM_MIN_CLUSTER_FRAC="0.003"

            # ---- cluster-level cleanup: OFF for the calibration run (log-only) ----
            DPMM_ABSORB="False"     # -> read the [absorb] distance table, then set ABSORB_SCALE
            DPMM_MERGE="False"
            ABSORB_SCALE="0.1"      # placeholder (inert while absorb off)
            MERGE_SCALE="1.0"

            # ---- Phase 3 ----
            PEAK_GATE="False"       # OFF: read the peak distribution first, then set PEAK_THRESH
            PEAK_THRESH="0.80"      # placeholder (inert while gate off)
            CE_WEIGHT="1.0"
            HEAD_LR="1e-2"
            LABELLED_WARMUP="0"     # 0: labelled-only warmup destabilised the CIFAR-10 head
            CONF_TEMP="50"          # was 0(=C=727): over-flattened confidence to ~uniform (0.014).
                                    # ~50 gives a usable spread once K>1 (inert while K=1)
            REF_ACC="0.0"           # placeholder — no CIFAR-100 reference yet (log-only comparison)
            P3_EXP="phase3_cifar100_8020_calib"

            # ============================================================
            # Stage 1 — fresh, seeded CBL (80 known classes)
            # ============================================================
            echo "=========================================="
            echo "Stage 1 (CIFAR-100 80/20, seed=$SEED): CBL pre-training | epochs=$STAGE1_EPOCHS smoke=$SMOKE"
            echo "=========================================="

            CBL_OUT="exp/${EXP_NAME}"
            if [ -f "$CBL_OUT/cbl_stage1.pt" ]; then
                echo "--- Stage 1 already done ($CBL_OUT/cbl_stage1.pt exists) — skipping ---"
            else
                python -m methods.contrastive_training.stage1_cbl \
                    --dataset_name "$DATASET" \
                    --num_labeled_classes "$NUM_LABELED" \
                    --prop_train_labels 0.5 \
                    --concept_conf_threshold "$CONF_THR" \
                    --seed "$SEED" \
                    --cbl_epochs "$STAGE1_EPOCHS" \
                    --cbl_lr 1e-4 \
                    --cbl_weight_decay 1e-5 \
                    --cbl_batch_size 256 \
                    --batch_size 128 \
                    --num_workers 4 \
                    --exp_name "$EXP_NAME" \
                    --use_wandb True \
                    --wandb_project "$WANDB_PROJECT" \
                    --wandb_entity "$WANDB_ENTITY"
            fi

            if [ ! -f "$CBL_OUT/cbl_stage1.pt" ] || [ ! -f "$CBL_OUT/vocab.json" ]; then
                echo "ERROR: Stage 1 outputs missing in $CBL_OUT (cbl_stage1.pt / vocab.json)."
                exit 1
            fi
            echo "Stage 1 COMPLETED — CBL: $CBL_OUT"
            echo "Concept vocabulary size (C):"; python -c "import json; print(len(json.load(open('$CBL_OUT/vocab.json'))))" 2>/dev/null || true
            ls -la "$CBL_OUT" 2>/dev/null || true

            # ============================================================
            # Phase 3 — discovery (log-only cleanup) + CE refinement
            # ============================================================
            S3_OUT="exp/${P3_EXP}"
            echo "=========================================="
            echo "Phase 3 (CIFAR-100 80/20, CALIBRATION): peak_gate=$PEAK_GATE absorb=$DPMM_ABSORB epochs=$P3_EPOCHS"
            echo "=========================================="
            python -m methods.contrastive_training.phase3 \
                --dataset_name "$DATASET" \
                --num_labeled_classes "$NUM_LABELED" \
                --cbl_dir "$CBL_OUT" \
                --prop_train_labels 0.5 \
                --concept_conf_threshold "$CONF_THR" \
                --epochs "$P3_EPOCHS" \
                --refresh_period "$REFRESH" \
                --cbl_lr "$CBL_LR" \
                --alpha_fidelity "$ALPHA_FIDELITY" \
                --grad_clip "$GRAD_CLIP" \
                --novelty_alpha "$NOVELTY_ALPHA" \
                --tau_mode "$TAU_MODE" \
                --lda_ridge_gamma "$LDA_RIDGE" \
                --dpmm_cov_scale "$DPMM_COV_SCALE" \
                --dpmm_alpha "$DPMM_ALPHA" \
                --dpmm_beta "$DPMM_BETA" \
                --dpmm_min_cluster_size "$DPMM_MIN_CLUSTER_SIZE" \
                --dpmm_min_cluster_frac "$DPMM_MIN_CLUSTER_FRAC" \
                --dpmm_seed "$DPMM_SEED" \
                --dpmm_absorb "$DPMM_ABSORB" \
                --dpmm_merge "$DPMM_MERGE" \
                --absorb_scale "$ABSORB_SCALE" \
                --merge_scale "$MERGE_SCALE" \
                --peak_gate "$PEAK_GATE" \
                --peak_thresh "$PEAK_THRESH" \
                --ce_weight "$CE_WEIGHT" \
                --head_lr "$HEAD_LR" \
                --labelled_warmup "$LABELLED_WARMUP" \
                --conf_temp "$CONF_TEMP" \
                --ref_acc "$REF_ACC" \
                --batch_size 128 \
                --num_workers 4 \
                --exp_name "$P3_EXP" \
                --use_wandb True \
                --wandb_project "$WANDB_PROJECT" \
                --wandb_entity "$WANDB_ENTITY"

            echo ""
            echo "=========================================="
            echo "CIFAR-100 80/20 CALIBRATION RUN COMPLETED — Stage1: $CBL_OUT | Phase3: $S3_OUT"
            echo "  Next: read C, cond(Sigma), [absorb] distances, [phase3 peak-gate] peaks,"
            echo "        and raw K^n; set ABSORB_SCALE / PEAK_THRESH / NOVELTY_ALPHA; re-run"
            echo "        with DPMM_ABSORB=True and PEAK_GATE=True."
            echo "=========================================="
            ls -la "$S3_OUT" 2>/dev/null || true

            if [ -d "logs/wandb" ]; then
                for run_dir in logs/wandb/offline-run-*; do
                    [ -d "$run_dir" ] || continue
                    echo "Syncing offline wandb run: $run_dir"
                    wandb sync "$run_dir" --project "$WANDB_PROJECT" --entity "$WANDB_ENTITY" \
                        || echo "Warning: failed to sync $run_dir"
                done
            fi
            echo "View results: https://wandb.ai/$WANDB_ENTITY/$WANDB_PROJECT"
            echo "Job finished!"

        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/gpu: 1
        env:
        - name: WANDB_API_KEY
          value: "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"
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: vindr-cxr-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      restartPolicy: Never
  backoffLimit: 0
