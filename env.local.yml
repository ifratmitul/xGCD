# xGCD local (macOS / CPU-MPS) environment — for development & testing only.
# The training env is env.yml (CUDA). This file drops pytorch-cuda so it installs
# the CPU/MPS PyTorch build available on macOS (Apple Silicon or Intel).
#   conda env create -f env.local.yml
#   conda activate xgcd
name: xgcd
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pip:
      - wandb
      - -r requirements.txt
