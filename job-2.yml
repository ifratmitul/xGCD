apiVersion: batch/v1
kind: Job
metadata:
  name: xgcd-cifar10-fresh
  namespace: longweiwangusd
spec:
  template:
    spec:
      containers:
      - name: xgcd-container
        image: continuumio/anaconda3:latest
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            set -e

            # GPU Verification
            echo "=========================================="
            echo "Verifying GPU availability..."
            echo "=========================================="
            sleep 5
            nvidia-smi || (echo "ERROR: GPU not accessible!" && exit 1)

            export CUDA_DEVICE_ORDER=PCI_BUS_ID

            cd /data/xGCD

            # Initialize conda
            source /opt/conda/etc/profile.d/conda.sh

            # Setup environment (creates env 'xGCD', caches DINO weights)
            echo "=========================================="
            echo "Running setup.sh..."
            echo "=========================================="
            bash setup.sh
            conda activate xGCD

            # Verify installation
            python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available!'; print(f'PyTorch {torch.__version__} / CUDA {torch.version.cuda}')"
            python -c "import wandb; print(f'wandb {wandb.__version__}')"
            python -c "import torch; print(f'GPU: {torch.cuda.get_device_name(0)}')"

            mkdir -p exp data/datasets logs/wandb

            # ============================================================
            # FRESH END-TO-END RUN: retrain Stage-1 CBL from scratch (SEEDED, reproducible),
            # then run Phase 3. New exp names (_v3) so it does NOT reuse the cached CBL and
            # does NOT collide with the current run. Compare the result to the cached 0.9158:
            #   ~same  -> the pipeline is robust to the CBL draw (not a lucky cached artifact)
            #   far    -> genuinely CBL-sensitive (important to know before CIFAR-100)
            # ============================================================
            DATASET="cifar10"
            EXP_NAME="stage1_cbl_cifar10_v3"   # fresh CBL (won't skip; not the cached one)
            SEED="42"                           # Stage-1 seed (reproducible; unseeded before)
            CONF_THR="0.15"

            WANDB_PROJECT="xGCD"
            WANDB_ENTITY="ifrat-ikhtear-university-of-south-dakota"
            export WANDB_DIR="logs"

            SMOKE="${SMOKE:-0}"
            if [ "$SMOKE" = "1" ]; then
                STAGE1_EPOCHS=2; WARMUP=2; STAGE2_EPOCHS=4; REFRESH=2
            else
                STAGE1_EPOCHS=50; WARMUP=0; STAGE2_EPOCHS=30; REFRESH=2
            fi

            # ---- estimation (frozen seed-42 recipe, same as the cached run) ----
            FREEZE_BACKBONE="True"
            CBL_LR="1e-3"
            ALPHA_FIDELITY="0.5"
            NOVELTY_ALPHA="0.2"
            TAU_MODE="empirical"
            GRAD_CLIP="1.0"
            DPMM_COV_SCALE="1.0"
            DPMM_ALPHA="1.0"
            DPMM_SEED="42"
            DPMM_ABSORB="True"
            DPMM_MERGE="False"
            ABSORB_SCALE="0.1"

            # ---- Phase 3 (same config as the cached run) ----
            PEAK_GATE="True"
            CE_WEIGHT="1.0"
            HEAD_LR="1e-2"
            LABELLED_WARMUP="0"      # 0: labelled-only warmup crashed the cached run (novel head rows went stale)
            CONF_TEMP="0.0"
            P3_EPOCHS="15"
            P3_EXP="phase3_cifar10_v3"

            # ============================================================
            # Stage 1 — fresh, seeded CBL
            # ============================================================
            echo "=========================================="
            echo "Stage 1 (FRESH, seed=$SEED): CBL pre-training | dataset=$DATASET epochs=$STAGE1_EPOCHS smoke=$SMOKE"
            echo "=========================================="

            CBL_OUT="exp/${EXP_NAME}"
            if [ -f "$CBL_OUT/cbl_stage1.pt" ]; then
                echo "--- Stage 1 v3 already done ($CBL_OUT/cbl_stage1.pt exists) — skipping ---"
            else
                python -m methods.contrastive_training.stage1_cbl \
                    --dataset_name "$DATASET" \
                    --prop_train_labels 0.5 \
                    --concept_conf_threshold "$CONF_THR" \
                    --seed "$SEED" \
                    --cbl_epochs "$STAGE1_EPOCHS" \
                    --cbl_lr 1e-4 \
                    --cbl_weight_decay 1e-5 \
                    --cbl_batch_size 256 \
                    --batch_size 128 \
                    --num_workers 4 \
                    --exp_name "$EXP_NAME" \
                    --use_wandb True \
                    --wandb_project "$WANDB_PROJECT" \
                    --wandb_entity "$WANDB_ENTITY"
            fi

            if [ ! -f "$CBL_OUT/cbl_stage1.pt" ] || [ ! -f "$CBL_OUT/vocab.json" ]; then
                echo "ERROR: Stage 1 outputs missing in $CBL_OUT (cbl_stage1.pt / vocab.json)."
                exit 1
            fi
            echo "Stage 1 COMPLETED — CBL: $CBL_OUT"
            ls -la "$CBL_OUT" 2>/dev/null || true

            # ============================================================
            # Phase 3 — CE refinement on the fresh estimate
            # ============================================================
            S3_OUT="exp/${P3_EXP}"
            echo "=========================================="
            echo "Phase 3 (FRESH): CE refinement | peak_gate=$PEAK_GATE epochs=$P3_EPOCHS head_lr=$HEAD_LR warmup=$LABELLED_WARMUP"
            echo "=========================================="
            python -m methods.contrastive_training.phase3 \
                --dataset_name "$DATASET" \
                --cbl_dir "$CBL_OUT" \
                --prop_train_labels 0.5 \
                --concept_conf_threshold "$CONF_THR" \
                --epochs "$P3_EPOCHS" \
                --refresh_period "$REFRESH" \
                --cbl_lr "$CBL_LR" \
                --alpha_fidelity "$ALPHA_FIDELITY" \
                --grad_clip "$GRAD_CLIP" \
                --novelty_alpha "$NOVELTY_ALPHA" \
                --tau_mode "$TAU_MODE" \
                --dpmm_cov_scale "$DPMM_COV_SCALE" \
                --dpmm_alpha "$DPMM_ALPHA" \
                --dpmm_seed "$DPMM_SEED" \
                --dpmm_absorb "$DPMM_ABSORB" \
                --dpmm_merge "$DPMM_MERGE" \
                --absorb_scale "$ABSORB_SCALE" \
                --peak_gate "$PEAK_GATE" \
                --peak_thresh 0.80 \
                --ce_weight "$CE_WEIGHT" \
                --head_lr "$HEAD_LR" \
                --labelled_warmup "$LABELLED_WARMUP" \
                --conf_temp "$CONF_TEMP" \
                --ref_acc 0.8707 \
                --batch_size 128 \
                --num_workers 4 \
                --exp_name "$P3_EXP" \
                --use_wandb True \
                --wandb_project "$WANDB_PROJECT" \
                --wandb_entity "$WANDB_ENTITY"

            echo ""
            echo "=========================================="
            echo "FRESH PIPELINE COMPLETED — Stage1: $CBL_OUT | Phase3: $S3_OUT"
            echo "=========================================="
            ls -la "$S3_OUT" 2>/dev/null || true

            if [ -d "logs/wandb" ]; then
                for run_dir in logs/wandb/offline-run-*; do
                    [ -d "$run_dir" ] || continue
                    echo "Syncing offline wandb run: $run_dir"
                    wandb sync "$run_dir" --project "$WANDB_PROJECT" --entity "$WANDB_ENTITY" \
                        || echo "Warning: failed to sync $run_dir"
                done
            fi
            echo "View results: https://wandb.ai/$WANDB_ENTITY/$WANDB_PROJECT"
            echo "Job finished!"

        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/rtxa6000: 1
          limits:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/rtxa6000: 1
        env:
        - name: WANDB_API_KEY
          value: "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"
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: vindr-cxr-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      restartPolicy: Never
  backoffLimit: 0
