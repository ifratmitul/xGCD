apiVersion: batch/v1
kind: Job
metadata:
  name: xgcd-cifar10-stage1
  namespace: longweiwangusd
spec:
  template:
    spec:
      containers:
      - name: xgcd-container
        image: continuumio/anaconda3:latest
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            set -e

            # GPU Verification
            echo "=========================================="
            echo "Verifying GPU availability..."
            echo "=========================================="
            sleep 5
            nvidia-smi || (echo "ERROR: GPU not accessible!" && exit 1)

            export CUDA_DEVICE_ORDER=PCI_BUS_ID

            cd /data/xGCD

            # Initialize conda
            source /opt/conda/etc/profile.d/conda.sh

            # Setup environment (creates env 'xGCD', caches DINO weights)
            echo "=========================================="
            echo "Running setup.sh..."
            echo "=========================================="
            bash setup.sh
            conda activate xGCD

            # Verify installation
            python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available!'; print(f'PyTorch {torch.__version__} / CUDA {torch.version.cuda}')"
            python -c "import wandb; print(f'wandb {wandb.__version__}')"
            python -c "import torch; print(f'GPU: {torch.cuda.get_device_name(0)}')"

            mkdir -p exp data/datasets logs/wandb

            # ============================================================
            # xGCD — Stage 1: CBL pre-training on CIFAR-10 (5 known / 5 novel)
            # (Stage 2 will be added once implemented.)
            # ============================================================
            DATASET="cifar10"
            EXP_NAME="stage1_cbl_cifar10"
            CONF_THR="0.15"

            WANDB_PROJECT="xGCD"
            WANDB_ENTITY="ifrat-ikhtear-university-of-south-dakota"
            export WANDB_DIR="logs"   # offline run data under logs/wandb/

            # Set SMOKE=1 in the job for a fast integration run.
            # RUN 1 = anti-forgetting experiment: short schedule to iterate fast (~3h).
            SMOKE="${SMOKE:-0}"
            if [ "$SMOKE" = "1" ]; then
                STAGE1_EPOCHS=2; WARMUP=2; STAGE2_EPOCHS=4; REFRESH=2
            else
                # WARMUP=1: strip the warmup-fusion confound so absorb/merge runs on the
                # clean rep (all 5 novel classes still separated). Re-add warmup later.
                STAGE1_EPOCHS=50; WARMUP=1; STAGE2_EPOCHS=30; REFRESH=2
            fi

            # ---- ESTIMATION-ONLY: warmup -> freeze -> one E-step (DPMM fixes 2+3) -> eval ----
            #      No Phase-2 joint loop / no DPMM->representation M-step.
            FREEZE_BACKBONE="True"
            CBL_LR="1e-3"          # CBL LR when frozen (0.1 diverges!)
            ALPHA_FIDELITY="0.5"
            NOVELTY_ALPHA="0.2"
            TAU_MODE="empirical"     # fix #2 ON  (data-calibrated gate)
            PCL_KNOWN_UNLAB_W="1.0"  # (irrelevant here)
            NORM_D2_BY_C="True"      # live L_CL, d^2/C
            PCL_WEIGHT="1.0"         # keep L_PCL(gt) in the labelled warmup (the 0.784->0.835 lift)
            GRAD_CLIP="1.0"        # safety net against blow-ups
            ESTIMATION_ONLY="True"   # warmup then freeze; no joint loop
            DPMM_COV_SCALE="1.0"     # fix #3 OFF — a merge error argues against s>1 here
            DPMM_ALPHA="1.0"         # sweep 0.3 / 0.1 in follow-up runs
            DPMM_SEED="42"           # DPMM Gibbs seed (was silently 0)
            # fix #2 cluster-level cleanup. LOG-ONLY calibration run: flags OFF so the
            # [absorb]/[merge] distance tables + [cov-scale-gt] print WITHOUT changing K^n.
            # Read the tables, pick absorb_scale/merge_scale, THEN flip these to True.
            DPMM_ABSORB="False"
            DPMM_MERGE="False"
            ABSORB_SCALE="1.0"       # absorb if d2(centroid, nearest known) < scale*tau
            MERGE_SCALE="1.0"        # merge if d2(centroids) < scale*tau  (calibrate from logs)
            S2_EXP="stage2_estonly_logonly_calib"

            echo "=========================================="
            echo "Stage 1: CBL pre-training | dataset=$DATASET epochs=$STAGE1_EPOCHS smoke=$SMOKE"
            echo "=========================================="

            CBL_OUT="exp/${EXP_NAME}"
            if [ -f "$CBL_OUT/cbl_stage1.pt" ]; then
                echo "--- Stage 1 already done ($CBL_OUT/cbl_stage1.pt exists) — skipping ---"
            else
                python -m methods.contrastive_training.stage1_cbl \
                    --dataset_name "$DATASET" \
                    --prop_train_labels 0.5 \
                    --concept_conf_threshold "$CONF_THR" \
                    --cbl_epochs "$STAGE1_EPOCHS" \
                    --cbl_lr 1e-4 \
                    --cbl_weight_decay 1e-5 \
                    --cbl_batch_size 256 \
                    --batch_size 128 \
                    --num_workers 4 \
                    --exp_name "$EXP_NAME" \
                    --use_wandb True \
                    --wandb_project "$WANDB_PROJECT" \
                    --wandb_entity "$WANDB_ENTITY"
            fi

            # Guard: confirm Stage-1 artifacts exist.
            if [ ! -f "$CBL_OUT/cbl_stage1.pt" ] || [ ! -f "$CBL_OUT/vocab.json" ]; then
                echo "ERROR: Stage 1 outputs missing in $CBL_OUT (cbl_stage1.pt / vocab.json)."
                exit 1
            fi
            echo "Stage 1 COMPLETED — CBL: $CBL_OUT"
            ls -la "$CBL_OUT" 2>/dev/null || true

            # ============================================================
            # xGCD — Stage 2: joint novel-class discovery + GCD
            # ============================================================
            S2_OUT="exp/${S2_EXP}"
            echo "=========================================="
            echo "Stage 2 (Run 1): xGCD | warmup=$WARMUP joint=$STAGE2_EPOCHS refresh=$REFRESH"
            echo "  freeze_backbone=$FREEZE_BACKBONE alpha_fidelity=$ALPHA_FIDELITY novelty_alpha=$NOVELTY_ALPHA"
            echo "=========================================="
            python -m methods.contrastive_training.xgcd \
                --dataset_name "$DATASET" \
                --cbl_dir "$CBL_OUT" \
                --prop_train_labels 0.5 \
                --concept_conf_threshold "$CONF_THR" \
                --warmup_epochs "$WARMUP" \
                --epochs "$STAGE2_EPOCHS" \
                --refresh_period "$REFRESH" \
                --lambda_warmup 20 \
                --freeze_backbone "$FREEZE_BACKBONE" \
                --cbl_lr "$CBL_LR" \
                --novelty_alpha "$NOVELTY_ALPHA" \
                --tau_mode "$TAU_MODE" \
                --alpha_fidelity "$ALPHA_FIDELITY" \
                --pcl_known_unlab_weight "$PCL_KNOWN_UNLAB_W" \
                --norm_d2_by_c "$NORM_D2_BY_C" \
                --pcl_weight "$PCL_WEIGHT" \
                --grad_clip "$GRAD_CLIP" \
                --estimation_only "$ESTIMATION_ONLY" \
                --dpmm_cov_scale "$DPMM_COV_SCALE" \
                --dpmm_alpha "$DPMM_ALPHA" \
                --dpmm_seed "$DPMM_SEED" \
                --dpmm_absorb "$DPMM_ABSORB" \
                --dpmm_merge "$DPMM_MERGE" \
                --absorb_scale "$ABSORB_SCALE" \
                --merge_scale "$MERGE_SCALE" \
                --lr 0.1 \
                --cbl_lr_divisor 100 \
                --batch_size 128 \
                --num_workers 4 \
                --exp_name "$S2_EXP" \
                --use_wandb True \
                --wandb_project "$WANDB_PROJECT" \
                --wandb_entity "$WANDB_ENTITY"

            echo ""
            echo "=========================================="
            echo "xGCD PIPELINE COMPLETED — Stage1: $CBL_OUT | Stage2: $S2_OUT"
            echo "=========================================="
            ls -la "$S2_OUT" 2>/dev/null || true

            # Sync any offline wandb runs (no-op when logged online)
            if [ -d "logs/wandb" ]; then
                for run_dir in logs/wandb/offline-run-*; do
                    [ -d "$run_dir" ] || continue
                    echo "Syncing offline wandb run: $run_dir"
                    wandb sync "$run_dir" --project "$WANDB_PROJECT" --entity "$WANDB_ENTITY" \
                        || echo "Warning: failed to sync $run_dir"
                done
            fi
            echo "View results: https://wandb.ai/$WANDB_ENTITY/$WANDB_PROJECT"
            echo "Job finished!"

        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/rtxa6000: 1
          limits:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/rtxa6000: 1
        env:
        - name: WANDB_API_KEY
          value: "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"
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: vindr-cxr-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      restartPolicy: Never
  backoffLimit: 0
